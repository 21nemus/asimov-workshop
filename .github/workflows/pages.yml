# Builds, tests and deploys ASIMOV WORKSHOP to GitHub Pages. Needs Settings → Pages → Source: GitHub Actions.
# The robot meshes, physics model and policy in public/ are committed, so CI downloads nothing upstream
# (the two tests that compare against the upstream viewer harness skip when tools/.cache/ is absent).
# Action versions match the sibling jumper-lab workflow, which is known to deploy.
#
# DEPLOYMENT IS MANUAL ONLY while release blockers are open (maintainer decision, 2026-10-12):
# pushes to main do not run this workflow. To publish later, either start it from the Actions tab
# ("Run workflow") or restore the push trigger:
#   push:
#     branches: [main]
name: Deploy to GitHub Pages (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
